name: Test Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-go-services:
    name: Go Services Coverage
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      nats:
        image: nats:2-alpine
        options: >-
          --health-cmd "wget -q --spider http://localhost:8222/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 4222:4222
          - 8222:8222

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: |
          go mod download
        working-directory: .

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
        run: |
          # Install migrate tool
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          # Run migrations
          migrate -path infra/db -database "$DATABASE_URL" up

      - name: Test User Service
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
          REDIS_ADDR: localhost:6379
        run: |
          cd services/user-service
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          
      - name: Test Transaction Service
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
          NATS_URL: nats://localhost:4222
        run: |
          cd services/transaction-service
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test Portfolio Service
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
          REDIS_ADDR: localhost:6379
          NATS_URL: nats://localhost:4222
          MARKETDATA_SERVICE_URL: localhost:50054
        run: |
          cd services/portfolio-service
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test MarketData Service
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
          REDIS_ADDR: localhost:6379
          MINIO_ENDPOINT: localhost:9000
        run: |
          cd services/marketdata-service
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test Gateway
        env:
          USER_SERVICE_URL: localhost:50051
          PORTFOLIO_SERVICE_URL: localhost:50052
          TRANSACTION_SERVICE_URL: localhost:50053
          MARKETDATA_SERVICE_URL: localhost:50054
        run: |
          cd apps/gateway
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload User Service coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/user-service/coverage.out
          flags: user-service
          name: user-service-coverage
          fail_ci_if_error: false

      - name: Upload Transaction Service coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/transaction-service/coverage.out
          flags: transaction-service
          name: transaction-service-coverage
          fail_ci_if_error: false

      - name: Upload Portfolio Service coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/portfolio-service/coverage.out
          flags: portfolio-service
          name: portfolio-service-coverage
          fail_ci_if_error: false

      - name: Upload MarketData Service coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/marketdata-service/coverage.out
          flags: marketdata-service
          name: marketdata-service-coverage
          fail_ci_if_error: false

      - name: Upload Gateway coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/gateway/coverage.out
          flags: gateway
          name: gateway-coverage
          fail_ci_if_error: false

  test-frontend:
    name: Frontend Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: apps/frontend
        continue-on-error: true

      - name: Upload Frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  coverage-report:
    name: Generate Coverage Report
    needs: [test-go-services, test-frontend]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: combined
          name: combined-coverage
          fail_ci_if_error: false
