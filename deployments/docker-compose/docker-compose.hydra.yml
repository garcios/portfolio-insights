version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL for Hydra
  # ---------------------------------------------------------------------------
  hydra-postgres:
    image: postgres:16-alpine
    container_name: hydra-postgres
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra_secret
      POSTGRES_DB: hydra
    ports:
      - "5433:5432"
    volumes:
      - hydra-postgres-data:/var/lib/postgresql/data
    networks:
      - hydra-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hydra" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Hydra DB Migration (runs once)
  # ---------------------------------------------------------------------------
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: 'postgres://hydra:hydra_secret@hydra-postgres:5432/hydra?sslmode=disable'
    command:
      - migrate
      - sql
      - "--yes"
      - $DSN
    # depends_on:
    #   hydra-postgres:
    #     condition: service_healthy
    restart: "no"
    networks:
      - hydra-network

  # ---------------------------------------------------------------------------
  # Hydra Admin API (internal)
  # ---------------------------------------------------------------------------
  hydra-admin:
    image: oryd/hydra:v2.2.0
    container_name: hydra-admin
    ports:
      - "4445:4445"
    command: serve admin --dev
    # depends_on:
    #   hydra-migrate:
    #     condition: service_completed_successfully
    environment:
      DSN: postgres://hydra:hydra_secret@hydra-postgres:5432/hydra?sslmode=disable

      # Correct issuer for container internal networking
      URLS_SELF_ISSUER: http://hydra-public:4444

      # Login & Consent
      URLS_LOGIN: http://login-consent-provider:3002/login
      URLS_CONSENT: http://login-consent-provider:3002/consent
      URLS_LOGOUT: http://login-consent-provider:3002/logout
      URLS_ERROR: http://login-consent-provider:3002/error

      # Secrets
      SECRETS_SYSTEM: youReallyNeedToChangeThis
      SECRETS_COOKIE: youReallyNeedToChangeThisToo
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: youReallyNeedToChangeThisThree

      # OAuth2
      OAUTH2_ACCESS_TOKEN_STRATEGY: jwt
      OAUTH2_EXPOSE_INTERNAL_ERRORS: "true"

      # TTL
      TTL_ACCESS_TOKEN: 15m
      TTL_REFRESH_TOKEN: 720h
      TTL_ID_TOKEN: 1h
      TTL_AUTH_CODE: 10m

      # Logging
      LOG_LEVEL: debug
      LOG_FORMAT: json

      # CORS
      SERVE_PUBLIC_CORS_ENABLED: "true"
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3002
      SERVE_ADMIN_CORS_ENABLED: "true"
      SERVE_ADMIN_CORS_ALLOWED_ORIGINS: http://localhost:3002
      SERVE_COOKIES_SAME_SITE_MODE: Lax

    networks:
      - hydra-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:4445/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Hydra Public API (external)
  # ---------------------------------------------------------------------------
  hydra-public:
    image: oryd/hydra:v2.2.0
    container_name: hydra-public
    ports:
      - "4444:4444"
    command: serve public --dev
    # depends_on:
    #   hydra-migrate:
    #     condition: service_completed_successfully
    environment:
      DSN: postgres://hydra:hydra_secret@hydra-postgres:5432/hydra?sslmode=disable

      URLS_SELF_ISSUER: http://hydra-public:4444
      URLS_LOGIN: http://localhost:3002/login
      URLS_CONSENT: http://localhost:3002/consent
      URLS_LOGOUT: http://localhost:3002/logout
      URLS_ERROR: http://localhost:3002/error

      SECRETS_SYSTEM: youReallyNeedToChangeThis
      SECRETS_COOKIE: youReallyNeedToChangeThisToo
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: youReallyNeedToChangeThisThree

      OAUTH2_ACCESS_TOKEN_STRATEGY: jwt
      OAUTH2_EXPOSE_INTERNAL_ERRORS: "true"

      TTL_ACCESS_TOKEN: 15m
      TTL_REFRESH_TOKEN: 720h
      TTL_ID_TOKEN: 1h
      TTL_AUTH_CODE: 10m

      LOG_LEVEL: debug
      LOG_FORMAT: json

      SERVE_PUBLIC_CORS_ENABLED: "true"
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3002
      SERVE_ADMIN_CORS_ENABLED: "true"
      SERVE_ADMIN_CORS_ALLOWED_ORIGINS: http://localhost:3002
      SERVE_COOKIES_SAME_SITE_MODE: Lax

    networks:
      - hydra-network
      - default
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://hydra-public:4444/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Login & Consent Provider
  # ---------------------------------------------------------------------------
  login-consent-provider:
    build:
      context: ../../apps/login-consent-provider
      dockerfile: Dockerfile
    container_name: login-consent-provider
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      HYDRA_ADMIN_URL: http://hydra-admin:4445
      # Service-to-service call to user-service instead of direct DB access
      USER_SERVICE_ADDR: user-service:50051
      SESSION_SECRET: changeThisToASecureRandomString
      LOG_LEVEL: debug
    # depends_on:
    #   hydra-admin:
    #     condition: service_healthy
    networks:
      - hydra-network
      - default
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Networks & Volumes
# ---------------------------------------------------------------------------
networks:
  hydra-network:
    driver: bridge
  default:
    external: true
    name: docker-compose_default

volumes:
  hydra-postgres-data:
