version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garcios
      POSTGRES_PASSWORD: Password123
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:latest
    command: "-js"
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  gateway:
    build:
      context: ../../
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORTFOLIO_SERVICE_ADDR=portfolio-service:50052
    depends_on:
      - user-service
      - portfolio-service

  user-service:
    build:
      context: ../../
      dockerfile: services/user-service/Dockerfile
    ports:
      - "50051:50051"
      - "9096:9096"
    environment:
      - DB_HOST=postgres
      - DB_USER=garcios
      - DB_PASSWORD=Password123
      - DB_NAME=portfolio
    depends_on:
      - postgres

  portfolio-service:
    build:
      context: ../../
      dockerfile: services/portfolio-service/Dockerfile
    ports:
      - "50052:50052"
      - "9098:9090"
    environment:
      - DB_HOST=postgres
      - DB_USER=garcios
      - DB_PASSWORD=Password123
      - DB_NAME=portfolio
      - NATS_URL=nats://nats:4222
      - REDIS_ADDR=redis:6379
      - PRICE_CACHE_TTL_SECONDS=60
      - MARKETDATA_SERVICE_ADDR=marketdata-service:50054
    depends_on:
      - postgres
      - nats
      - redis
      - marketdata-service

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  marketdata-service:
    build:
      context: ../../
      dockerfile: services/marketdata-service/Dockerfile
    ports:
      - "50054:50054"
      - "9099:9099"
    environment:
      - DB_HOST=postgres
      - DB_USER=garcios
      - DB_PASSWORD=Password123
      - DB_NAME=portfolio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=market-data
    depends_on:
      - postgres
      - minio

  transaction-service:
    build:
      context: ../../
      dockerfile: services/transaction-service/Dockerfile
    ports:
      - "50053:50053"
      - "9097:9097"
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_USER=garcios
      - DB_PASSWORD=Password123
      - DB_NAME=portfolio
      - PORT=50053
      - HTTP_PORT=8081
      - NATS_URL=nats://nats:4222
    depends_on:
      - postgres
      - nats

volumes:
  postgres_data:
  minio_data:
  redis_data:
