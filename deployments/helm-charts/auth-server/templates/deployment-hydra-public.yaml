{{- if .Values.hydraPublic.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth-server.hydraPublic.fullname" . }}
  labels:
    {{- include "auth-server.hydraPublic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.hydraPublic.replicaCount }}
  selector:
    matchLabels:
      {{- include "auth-server.hydraPublic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Note: Kubernetes does not natively support depends_on from docker-compose.
        # Consider using init containers or readiness probes to ensure proper startup ordering.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "auth-server.hydraPublic.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "auth-server.serviceAccountName" . }}
      # Init container to wait for postgres and migration
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "auth-server.postgres.fullname" . }} {{ .Values.postgres.service.port }}; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: hydra-public
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.hydraPublic.image.repository }}:{{ .Values.hydraPublic.image.tag }}"
        imagePullPolicy: {{ .Values.hydraPublic.image.pullPolicy }}
        command: ["hydra"]
        args: ["serve", "public", "--dev"]
        ports:
        - name: public
          containerPort: 4444
          protocol: TCP
        env:
        - name: DSN
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: database-dsn
        - name: URLS_SELF_ISSUER
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-issuer-url
        - name: URLS_LOGIN
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-login-url
        - name: URLS_CONSENT
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-consent-url
        - name: URLS_LOGOUT
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-logout-url
        - name: URLS_ERROR
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-error-url
        - name: SECRETS_SYSTEM
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: hydra-system-secret
        - name: SECRETS_COOKIE
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: hydra-cookie-secret
        - name: OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: hydra-oidc-pairwise-salt
        - name: OAUTH2_ACCESS_TOKEN_STRATEGY
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-oauth2-access-token-strategy
        - name: OAUTH2_EXPOSE_INTERNAL_ERRORS
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-oauth2-expose-internal-errors
        - name: TTL_ACCESS_TOKEN
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-ttl-access-token
        - name: TTL_REFRESH_TOKEN
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-ttl-refresh-token
        - name: TTL_ID_TOKEN
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-ttl-id-token
        - name: TTL_AUTH_CODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-ttl-auth-code
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-log-level
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-log-format
        - name: SERVE_PUBLIC_CORS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-cors-public-enabled
        - name: SERVE_PUBLIC_CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-cors-public-allowed-origins
        - name: SERVE_ADMIN_CORS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-cors-admin-enabled
        - name: SERVE_ADMIN_CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-cors-admin-allowed-origins
        - name: SERVE_COOKIES_SAME_SITE_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: hydra-public-cookies-same-site-mode
        {{- if .Values.hydraPublic.healthcheck.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.hydraPublic.healthcheck.path }}
            port: public
          initialDelaySeconds: {{ .Values.hydraPublic.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.hydraPublic.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.hydraPublic.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.hydraPublic.healthcheck.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.hydraPublic.healthcheck.path }}
            port: public
          initialDelaySeconds: {{ .Values.hydraPublic.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.hydraPublic.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.hydraPublic.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.hydraPublic.healthcheck.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.hydraPublic.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
