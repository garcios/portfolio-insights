{{- if .Values.loginConsentProvider.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth-server.loginConsentProvider.fullname" . }}
  labels:
    {{- include "auth-server.loginConsentProvider.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.loginConsentProvider.replicaCount }}
  selector:
    matchLabels:
      {{- include "auth-server.loginConsentProvider.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Service-to-service architecture: login-consent-provider calls user-service via gRPC
        # No direct database access - improved security and separation of concerns
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "auth-server.loginConsentProvider.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "auth-server.serviceAccountName" . }}
      # Init containers to wait for dependencies
      initContainers:
      - name: wait-for-hydra-admin
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "auth-server.hydraAdmin.fullname" . }} {{ .Values.hydraAdmin.service.port }}; do echo waiting for hydra-admin; sleep 2; done;']
      - name: wait-for-user-service
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ .Values.loginConsentProvider.config.userServiceAddr | replace ":50051" "" }} 50051; do echo waiting for user-service; sleep 2; done;']
      containers:
      - name: login-consent-provider
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.loginConsentProvider.image.repository }}:{{ .Values.loginConsentProvider.image.tag }}"
        imagePullPolicy: {{ .Values.loginConsentProvider.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3002
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: login-consent-port
        - name: HYDRA_ADMIN_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: login-consent-hydra-admin-url
        - name: USER_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: login-consent-user-service-addr
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: session-secret
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "auth-server.fullname" . }}-config
              key: login-consent-log-level
        # Note: No healthcheck defined in docker-compose for login-consent-provider
        # Consider adding liveness and readiness probes if the application supports them
        resources:
          {{- toYaml .Values.loginConsentProvider.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
