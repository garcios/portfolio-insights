{{- if .Values.postgres.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth-server.postgres.fullname" . }}
  labels:
    {{- include "auth-server.postgres.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "auth-server.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "auth-server.postgres.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "auth-server.serviceAccountName" . }}
      containers:
      - name: postgres
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
        imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: postgres-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: postgres-database
        {{- if .Values.postgres.healthcheck.enabled }}
        livenessProbe:
          exec:
            command:
            {{- range .Values.postgres.healthcheck.command }}
            - {{ . }}
            {{- end }}
          initialDelaySeconds: {{ .Values.postgres.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.postgres.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.postgres.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.postgres.healthcheck.failureThreshold }}
        readinessProbe:
          exec:
            command:
            {{- range .Values.postgres.healthcheck.command }}
            - {{ . }}
            {{- end }}
          initialDelaySeconds: {{ .Values.postgres.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.postgres.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.postgres.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.postgres.healthcheck.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
        {{- if .Values.postgres.persistence.enabled }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        {{- end }}
      {{- if .Values.postgres.persistence.enabled }}
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: {{ include "auth-server.postgres.fullname" . }}-pvc
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
