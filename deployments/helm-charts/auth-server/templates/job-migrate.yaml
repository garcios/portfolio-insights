{{- if .Values.hydraMigrate.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "auth-server.hydraMigrate.fullname" . }}
  labels:
    {{- include "auth-server.hydraMigrate.labels" . | nindent 4 }}
  annotations:
    # This annotation ensures the job runs before deployments
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Job should not be restarted on failure in production
  # Set backoffLimit appropriately for your use case
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "auth-server.hydraMigrate.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "auth-server.serviceAccountName" . }}
      # Init container to wait for postgres to be ready
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "auth-server.postgres.fullname" . }} {{ .Values.postgres.service.port }}; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: hydra-migrate
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.hydraMigrate.image.repository }}:{{ .Values.hydraMigrate.image.tag }}"
        imagePullPolicy: {{ .Values.hydraMigrate.image.pullPolicy }}
        command: ["hydra"]
        args:
        - migrate
        - sql
        - "--yes"
        - $(DSN)
        env:
        - name: DSN
          valueFrom:
            secretKeyRef:
              name: {{ include "auth-server.fullname" . }}-secrets
              key: database-dsn
        resources:
          {{- toYaml .Values.hydraMigrate.resources | nindent 10 }}
{{- end }}
