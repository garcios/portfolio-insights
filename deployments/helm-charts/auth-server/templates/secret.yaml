apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-server.fullname" . }}-secrets
  labels:
    {{- include "auth-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL credentials
  postgres-username: {{ .Values.postgres.auth.username | quote }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  postgres-database: {{ .Values.postgres.auth.database | quote }}
  
  # Hydra secrets
  hydra-system-secret: {{ .Values.secrets.hydra.system | quote }}
  hydra-cookie-secret: {{ .Values.secrets.hydra.cookie | quote }}
  hydra-oidc-pairwise-salt: {{ .Values.secrets.hydra.oidcPairwiseSalt | quote }}
  
  # Login consent provider session secret
  session-secret: {{ .Values.secrets.sessionSecret | quote }}
  
  # Database DSN (constructed)
  database-dsn: {{ include "auth-server.dsn" . | quote }}
