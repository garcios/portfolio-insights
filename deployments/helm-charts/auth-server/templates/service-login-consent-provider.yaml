{{- if .Values.loginConsentProvider.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "auth-server.loginConsentProvider.fullname" . }}
  labels:
    {{- include "auth-server.loginConsentProvider.labels" . | nindent 4 }}
spec:
  type: {{ .Values.loginConsentProvider.service.type }}
  ports:
  - port: {{ .Values.loginConsentProvider.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "auth-server.loginConsentProvider.selectorLabels" . | nindent 4 }}
{{- end }}
