{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "auth-server.postgres.fullname" . }}
  labels:
    {{- include "auth-server.postgres.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}
  ports:
  - port: {{ .Values.postgres.service.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    {{- include "auth-server.postgres.selectorLabels" . | nindent 4 }}
{{- end }}
