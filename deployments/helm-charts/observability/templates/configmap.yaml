apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.config.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.config.evaluationInterval }}
      external_labels:
        cluster: 'portfolio-insights-{{ .Values.global.environment }}'
        environment: '{{ .Values.global.environment }}'

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ include "observability.fullname" . }}-alertmanager:{{ .Values.alertmanager.service.port }}

    rule_files:
      - "/etc/prometheus/alerts.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'gateway-service'
        static_configs:
          - targets: ['{{ .Values.prometheus.config.targets.gateway }}']
            labels:
              service: 'gateway'
              tier: 'api'

      - job_name: 'user-service'
        static_configs:
          - targets: ['{{ .Values.prometheus.config.targets.user }}']
            labels:
              service: 'user'
              tier: 'backend'

      - job_name: 'transaction-service'
        static_configs:
          - targets: ['{{ .Values.prometheus.config.targets.transaction }}']
            labels:
              service: 'transaction'
              tier: 'backend'

      - job_name: 'portfolio-service'
        static_configs:
          - targets: ['{{ .Values.prometheus.config.targets.portfolio }}']
            labels:
              service: 'portfolio'
              tier: 'backend'

      - job_name: 'marketdata-service'
        static_configs:
          - targets: ['{{ .Values.prometheus.config.targets.marketdata }}']
            labels:
              service: 'marketdata'
              tier: 'backend'

  alerts.yml: |
    groups:
      - name: service_health
        interval: 30s
        rules:
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service)
                /
                sum(rate(http_requests_total[5m])) by (service)
              ) > 0.01
            for: 5m
            labels:
              severity: critical
              team: backend
            annotations:
              summary: "High error rate on {{ "{{" }} $labels.service {{ "}}" }}"
              description: "Service {{ "{{" }} $labels.service {{ "}}" }} has error rate of {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold: 1%)"

          - alert: HighLatency
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)
              ) > 1
            for: 10m
            labels:
              severity: warning
              team: backend
            annotations:
              summary: "High latency on {{ "{{" }} $labels.service {{ "}}" }}"
              description: "Service {{ "{{" }} $labels.service {{ "}}" }} P95 latency is {{ "{{" }} $value {{ "}}" }}s (threshold: 1s)"

          - alert: ServiceDown
            expr: up{job=~".*-service"} == 0
            for: 2m
            labels:
              severity: critical
              team: backend
            annotations:
              summary: "Service {{ "{{" }} $labels.job {{ "}}" }} is down"
              description: "Service {{ "{{" }} $labels.job {{ "}}" }} has been down for more than 2 minutes"

      - name: business_metrics
        interval: 1m
        rules:
          - alert: HighTransactionFailureRate
            expr: |
              (
                sum(rate(grpc_requests_total{method=~".*CreateTransaction", status!="OK"}[5m]))
                /
                sum(rate(grpc_requests_total{method=~".*CreateTransaction"}[5m]))
              ) > 0.05
            for: 5m
            labels:
              severity: critical
              team: backend
            annotations:
              summary: "High transaction failure rate"
              description: "Transaction creation failure rate is {{ "{{" }} $value | humanizePercentage {{ "}}" }} (threshold: 5%)"

  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-alerts'

    receivers:
      - name: 'default'
      - name: 'critical-alerts'
      - name: 'warning-alerts'

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']

  grafana-datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://{{ include "observability.fullname" . }}-prometheus:{{ .Values.prometheus.service.port }}
        access: proxy
        isDefault: true
