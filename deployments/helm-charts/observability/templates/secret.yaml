apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observability.fullname" . }}-grafana
  labels:
    {{- include "observability.labels" . | nindent 4 }}
type: Opaque
data:
  admin-user: {{ .Values.grafana.admin.user | b64enc | quote }}
  admin-password: {{ .Values.grafana.admin.password | b64enc | quote }}
