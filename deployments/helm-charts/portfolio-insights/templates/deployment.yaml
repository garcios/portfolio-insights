{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portfolio-insights.fullname" $ }}-{{ $name }}
  labels:
    {{- include "portfolio-insights.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    {{- if $svc.dependsOn }}
    # Depends on: {{ $svc.dependsOn | join ", " }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "portfolio-insights.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "portfolio-insights.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- if $svc.command }}
          command:
            {{- toYaml $svc.command | nindent 12 }}
          {{- end }}
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $key, $val := $svc.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "portfolio-insights.fullname" $ }}-{{ $name }}-secret
                  key: {{ $key }}
            {{- end }}
          {{- if $svc.ports }}
          livenessProbe:
            tcpSocket:
              port: {{ (first $svc.ports).targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: {{ (first $svc.ports).targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $svc.persistence }}
          volumeMounts:
            - name: data
              mountPath: {{ $svc.persistence.mountPath }}
          {{- end }}
      {{- if $svc.persistence }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "portfolio-insights.fullname" $ }}-{{ $name }}-pvc
      {{- end }}
{{- end }}
{{- end }}
