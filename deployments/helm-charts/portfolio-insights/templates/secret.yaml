{{- range $name, $svc := .Values.services }}
{{- if $svc.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portfolio-insights.fullname" $ }}-{{ $name }}-secret
  labels:
    {{- include "portfolio-insights.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
type: Opaque
stringData:
  {{- range $key, $val := $svc.secrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
