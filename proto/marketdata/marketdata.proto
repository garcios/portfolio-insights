syntax = "proto3";

package marketdata;

option go_package = "github.com/garcios/portfolio-insights/services/marketdata-service/proto/marketdata";

import "google/protobuf/timestamp.proto";

service MarketDataService {
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetLatestPrice(GetLatestPriceRequest) returns (GetLatestPriceResponse);
  rpc GetLatestPrices(GetLatestPricesRequest) returns (GetLatestPricesResponse);
  rpc GetHistoricalPrices(GetHistoricalPricesRequest) returns (GetHistoricalPricesResponse);
  rpc GetLatestCurrencyRate(GetLatestCurrencyRateRequest) returns (GetLatestCurrencyRateResponse);
  rpc GetHistoricalCurrencyRates(GetHistoricalCurrencyRatesRequest) returns (GetHistoricalCurrencyRatesResponse);
}

message Asset {
  string id = 1;
  string symbol = 2;
  string name = 3;
  string type = 4;
  string exchange = 5;
  string currency = 6;
}

message AssetPrice {
  string asset_id = 1;
  double price = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message GetAssetRequest {
  string symbol = 1;
}

message GetAssetResponse {
  Asset asset = 1;
}

message ListAssetsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListAssetsResponse {
  repeated Asset assets = 1;
  string next_page_token = 2;
}

message GetLatestPriceRequest {
  string symbol = 1;
}

message GetLatestPriceResponse {
  AssetPrice price = 1;
}

message GetLatestPricesRequest {
  repeated string symbols = 1;
}

message GetLatestPricesResponse {
  map<string, AssetPrice> prices = 1;
}

message GetHistoricalPricesRequest {
  string symbol = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  string interval = 4; // e.g., "1d", "1h"
}

message GetHistoricalPricesResponse {
  repeated AssetPrice prices = 1;
}

message CurrencyRate {
  string id = 1;
  string base_currency = 2;
  string target_currency = 3;
  double rate = 4;
  google.protobuf.Timestamp rate_date = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetLatestCurrencyRateRequest {
  string base_currency = 1;
  string target_currency = 2;
}

message GetLatestCurrencyRateResponse {
  CurrencyRate currency_rate = 1;
}

message GetHistoricalCurrencyRatesRequest {
  string base_currency = 1;
  string target_currency = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
}

message GetHistoricalCurrencyRatesResponse {
  repeated CurrencyRate rates = 1;
}

