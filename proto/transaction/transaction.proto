syntax = "proto3";

package transaction;

option go_package = "github.com/garcios/portfolio-insights/services/transaction-service/proto/transaction";

import "google/protobuf/timestamp.proto";

service TransactionService {
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc UpdateTransaction(UpdateTransactionRequest) returns (UpdateTransactionResponse);
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionResponse);
}

message Transaction {
  string id = 1;
  string user_id = 2;
  string symbol = 3;
  string type = 4; // BUY or SELL
  double quantity = 5;
  double price_per_share = 6;
  google.protobuf.Timestamp executed_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  double brokerage = 10;
  string notes = 11;
  string price_currency = 12;
  string brokerage_currency = 13;
}

message CreateTransactionRequest {
  string user_id = 1;
  string symbol = 2;
  string type = 3;
  double quantity = 4;
  double price_per_share = 5;
  google.protobuf.Timestamp executed_at = 6;
  double brokerage = 7;
  string notes = 8;
  string price_currency = 9;
  string brokerage_currency = 10;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
}

message GetTransactionRequest {
  string id = 1;
}

message GetTransactionResponse {
  Transaction transaction = 1;
}

message ListTransactionsRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string next_page_token = 2;
}

message UpdateTransactionRequest {
  string id = 1;
  string symbol = 2;
  string type = 3;
  double quantity = 4;
  double price_per_share = 5;
  google.protobuf.Timestamp executed_at = 6;
  double brokerage = 7;
  string notes = 8;
  string price_currency = 9;
  string brokerage_currency = 10;
}

message UpdateTransactionResponse {
  Transaction transaction = 1;
}

message DeleteTransactionRequest {
  string id = 1;
}

message DeleteTransactionResponse {
  bool success = 1;
}
