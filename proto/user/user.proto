syntax = "proto3";

package user;

option go_package = "github.com/garcios/portfolio-insights/services/user-service/proto/user";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

// UserService handles user management and authentication verification.
service UserService {
  option (google.api.default_host) = "user-service:50051";

  // GetUser retrieves user details by their resource name.
  rpc GetUser (GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/{name=users/*}"
    };
    option (google.api.method_signature) = "name";
  }
  
  // CreateUser registers a new user in the system.
  rpc CreateUser (CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "user"
    };
    option (google.api.method_signature) = "user";
  }
  
  // VerifyUser checks credentials for login or verification purposes.
  // This is a custom method for authentication.
  rpc VerifyUser (VerifyUserRequest) returns (VerifyUserResponse) {
    option (google.api.http) = {
      post: "/v1/users:verify"
      body: "*"
    };
  }

  // UpdateUser updates user details.
  rpc UpdateUser (UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/v1/{user.name=users/*}"
      body: "user"
    };
    option (google.api.method_signature) = "user,update_mask";
  }
}

// User represents a user account in the system.
message User {
  option (google.api.resource) = {
    type: "portfolioinsights.googleapis.com/User"
    pattern: "users/{user}"
    singular: "user"
    plural: "users"
  };

  // Resource name of the user.
  // Format: users/{user}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The user's email address.
  string email = 2 [(google.api.field_behavior) = REQUIRED];

  // The user's username.
  string username = 3 [(google.api.field_behavior) = REQUIRED];

  // The user's hashed password.
  // This field is never returned in responses.
  string password = 4 [(google.api.field_behavior) = INPUT_ONLY];

  // The user's first name.
  string first_name = 5;

  // The user's last name.
  string last_name = 6;

  // The user's role (e.g., USER, ADMIN).
  string role = 7;

  // The user's preferences.
  google.protobuf.Struct preferences = 8;

  // The timestamp when the user last logged in.
  google.protobuf.Timestamp last_login_at = 9;

  // Output only. The user ID extracted from the resource name.
  // This is provided for convenience.
  string user_id = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// GetUserRequest is the request message for GetUser.
message GetUserRequest {
  // The resource name of the user to retrieve.
  // Format: users/{user}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "portfolioinsights.googleapis.com/User"
    }
  ];
}

// CreateUserRequest is the request message for CreateUser.
message CreateUserRequest {
  // The user to create.
  // The user's name field is ignored; the server assigns the user ID.
  User user = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The user ID to use for this user.
  // If not provided, the server will generate one.
  // Must be 1-63 characters, lowercase letters, numbers, and hyphens.
  string user_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// VerifyUserRequest is the request message for VerifyUser.
// This is a custom method for authentication.
message VerifyUserRequest {
  // The email of the user to verify.
  string email = 1 [(google.api.field_behavior) = REQUIRED];

  // The password to verify against.
  string password = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];
}

// VerifyUserResponse is the response message for VerifyUser.
message VerifyUserResponse {
  // True if credentials are valid, false otherwise.
  bool valid = 1;

  // The user resource if credentials are valid.
  // If invalid, this field is not set.
  User user = 2;
}

// UpdateUserRequest is the request message for UpdateUser.
message UpdateUserRequest {
  // The user to update.
  // The user's name field is used to identify the user to update.
  // Format: users/{user}
  User user = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to be updated.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}
